name: Local Source Snapshot

on:
  push:
    paths:
      - ".github/local-source-snapshot-trigger"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare source snapshot archive
        run: |
          set -euo pipefail
          rm -rf source-snapshot
          mkdir -p source-snapshot
          tar             --exclude='.git'             --exclude='.gradle'             --exclude='*/build'             --exclude='source-snapshot'             -czf /tmp/angcode-source.tar.gz .
          cp /tmp/angcode-source.tar.gz source-snapshot/
          test -s source-snapshot/angcode-source.tar.gz
          tar -tzf source-snapshot/angcode-source.tar.gz | head -n 20

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: angcode-source-snapshot
          path: source-snapshot/angcode-source.tar.gz
          retention-days: 1
          if-no-files-found: error
