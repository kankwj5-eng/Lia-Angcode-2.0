name: Local Source Snapshot

on:
  push:
    paths:
      - ".github/local-source-snapshot-trigger"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Pack source snapshot
        run: |
          tar             --exclude='.git'             --exclude='.gradle'             --exclude='*/build'             --exclude='*/build/*'             --exclude='angcode-source-snapshot.tar.gz'             -czf angcode-source-snapshot.tar.gz .

      - name: Verify snapshot
        run: |
          test -s angcode-source-snapshot.tar.gz
          tar -tzf angcode-source-snapshot.tar.gz | head -50
          sha256sum angcode-source-snapshot.tar.gz

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: angcode-source-snapshot
          path: angcode-source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
