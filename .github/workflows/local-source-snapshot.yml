name: Local Source Snapshot

on:
  push:
    paths:
      - ".github/local-source-snapshot-trigger"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Prepare source snapshot
        run: |
          rm -rf .local-source-snapshot
          mkdir -p .local-source-snapshot
          rsync -a             --exclude '.git/'             --exclude '.gradle/'             --exclude '**/build/'             --exclude '.local-source-snapshot/'             ./ .local-source-snapshot/

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: angcode-source-snapshot
          path: .local-source-snapshot/
          retention-days: 1
          if-no-files-found: error
