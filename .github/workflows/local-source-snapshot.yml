name: Local Source Snapshot

on:
  push:
    paths:
      - ".github/local-source-snapshot-trigger"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Pack source snapshot
        run: |
          rm -f /tmp/angcode-source-snapshot.tar.gz
          tar             --exclude='.git'             --exclude='.gradle'             --exclude='*/build'             --exclude='*/build/*'             -czf /tmp/angcode-source-snapshot.tar.gz .

      - name: Verify snapshot
        run: |
          test -s /tmp/angcode-source-snapshot.tar.gz
          sha256sum /tmp/angcode-source-snapshot.tar.gz
          tar -tzf /tmp/angcode-source-snapshot.tar.gz >/dev/null

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: angcode-source-snapshot
          path: /tmp/angcode-source-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
